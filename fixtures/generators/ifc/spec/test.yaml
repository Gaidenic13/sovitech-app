# TEST FIXTURE SPEC: the building behind every synthetic fixture of the `test` profile
# (docs/ifc-input.md 5.2 and 5.3). A fictitious hotel, working name "Demo Hotel Bucharest".
# Every value here is invented for tests; none comes from a real building, the mockups, the specs'
# transcriptions of them or company/ (guardrails rules 1 and 13; prompt 3 sections 7 and 8).
#
# This file is the ground truth the generators read: fixtures/generators/ifc/demo_hotel.py writes
# the four IFC models and their ground-truth JSON from it, fixtures/generators/ids/sovitech_ids.py
# derives the expected model-check results from it, and the PDF and XLSX companions reuse its rooms
# and tags. Lengths are millimetres, areas square metres, powers watts, airflows cubic metres per
# second (the units the models declare). Decimal values are strings, so no float ever touches them.
#
# `exercises` names what an item is for: guardrail case ids (docs/guardrails.md section 7) and the
# proposed IFC cases of ifc-input 5.4 (IFC-n, not indexed). It is documentation, not a result.

profile: test
version: "1"

project:
  name: Demo Hotel Bucharest
  description: "TEST fixture: synthetic model of a fictitious hotel. Not a real project."

site:
  name: Amplasament Demo Hotel Bucharest (fictiv)

building:
  name: Demo Hotel Bucharest
  footprint: [61700, 20000]
  psets:
    Pset_BuildingCommon:
      NumberOfStoreys: {type: IfcInteger, value: 5, exercises: [G4-11]}
      OccupancyType: {type: IfcLabel, value: Hotel}
      GrossPlannedArea: {type: IfcAreaMeasure, value: "6170", exercises: [G8-2]}

# Storeys: the ARH names, then the MEP names (slightly different on purpose: ifc-input 6.2.4).
storeys:
