# MEP systems (ifc-input 5.3, plus the gas detection system that covers the "Gas" row of 4.4).
# Both diacritic forms on purpose: "Detecţie" with ţ (U+0163), "Detecție" with ț (U+021B).
systems:
  - {key: ventilare-cta-01, name: Ventilare CTA-01, type: VENTILATION}
  - {key: ventilare-parcare, name: Ventilare parcare, type: VENTILATION}
  - {key: desfumare-parcare, name: Desfumare parcare, type: USERDEFINED, objectType: Desfumare, exercises: [G11-4, "4.4 glossary: desfumare"]}
  - {key: apa-racita, name: Apă răcită, type: CHILLEDWATER}
  - {key: incalzire, name: Încălzire, type: HEATING}
  - {key: sprinklere, name: Sprinklere, type: FIREPROTECTION}
  - {key: detectie-incendiu, name: Detecţie incendiu, type: FIREPROTECTION}
  - {key: iluminat, name: Iluminat, type: LIGHTING}
  - {key: automatizare, name: Automatizare, type: CONTROL}
  - {key: detectie-gaz, name: Detecție gaz, type: USERDEFINED, objectType: Detecție gaz, exercises: ["4.4 gas row (added to 5.3's list)"]}

# Box sizes [width, depth, height] in mm, by IFC4 class, for the element shapes.
boxSizes:
  IfcUnitaryEquipment: [4000, 1500, 2000]
  IfcChiller: [3000, 1200, 1800]
  IfcPump: [600, 600, 800]
  IfcFan: [800, 800, 800]
  IfcAirTerminalBox: [800, 400, 300]
  IfcDamper: [400, 400, 200]
  IfcValve: [200, 200, 200]
  IfcFlowMeter: [300, 200, 300]
  IfcFireSuppressionTerminal: [50, 50, 100]
  IfcLightFixture: [600, 600, 80]
  IfcSensor: [100, 100, 100]
  IfcActuator: [150, 150, 150]
  IfcController: [800, 300, 1200]
  IfcUnitaryControlElement: [600, 200, 800]
  IfcAlarm: [100, 50, 100]
  IfcElectricDistributionBoard: [1200, 400, 2000]
  IfcBuildingElementProxy: [1000, 1000, 1000]

# The pump type (IFC4): PredefinedType and manufacturer data live on the type object, so a
# locator path through the type ('type:Pset_ManufacturerTypeInformation.Manufacturer') exists.
pumpType:
  key: pump-type-circulatie
  name: Pompă circulație
  predefinedType: CIRCULATOR
  psets:
    Pset_ManufacturerTypeInformation:
      Manufacturer: {type: IfcLabel, value: Exemplu Pompe SRL}
      ModelLabel: {type: IfcLabel, value: EXP-CIRC-40}

# MEP elements, rev A. `class` is the IFC4 class; `ifc2x3` says how the IFC2X3 copy writes it.
# `count` repeats an untagged element; `tags` repeats a tagged one. `container` is a storey key,
# or `space:<key>` for a MEP space, or null (not contained). `lifeSafety` lists the 4.4 signals.
elements:
  - key: CTA-01
    class: IfcUnitaryEquipment
    predefinedType: AIRHANDLER
    name: Centrală tratare aer
    tag: CTA-01
    container: S1
    systems: [ventilare-cta-01]
    psets:
      Pset_ManufacturerTypeInformation:
        Manufacturer: {type: IfcLabel, value: Exemplu Clima SRL}
        ModelLabel: {type: IfcLabel, value: EXC-AHU-12}
      Date tehnice:
        Debit aer: {type: IfcVolumetricFlowRateMeasure, value: "2.5", exercises: [IFC-8]}
        Temperatură refulare: {type: IfcThermodynamicTemperatureMeasure, value: "18"}
    ifc2x3: {class: IfcEnergyConversionDevice, type: IfcUnitaryEquipmentType, typeKey: ahu}
    exercises: [G3-1, G4-3, IFC-8, "type Likely from AIRHANDLER"]
  - key: CTA-02
    class: IfcBuildingElementProxy
    predefinedType: NOTDEFINED
    name: CTA-02 Centrală tratare aer
    tag: "401301"
    container: S1
    systems: []
    psets:
      Date tehnice:
        Debit aer: {type: IfcLabel, value: cca. 8.000 m³/h, exercises: ["approximate wording kept (rule 8)"]}
    ifc2x3: {class: IfcBuildingElementProxy}
    exercises: [G3-8, "tag from Name, glossary prefix CTA gives Likely", "IDS S08 fails (no ObjectType)", "removed in rev B"]
  - key: CTA-03-AHU
    class: IfcUnitaryEquipment
    predefinedType: AIRHANDLER
    name: Centrală tratare aer
    tag: CTA-03
    container: S1
    systems: [ventilare-parcare]
    ifc2x3: {class: IfcEnergyConversionDevice, type: IfcUnitaryEquipmentType, typeKey: ahu}
    exercises: [G4-16, "one asset, type conflict to the engineer"]
  - key: CTA-03-FAN
    class: IfcFan
    predefinedType: CENTRIFUGALBACKWARDINCLINEDCURVED
    name: Ventilator CTA-03
    tag: CTA-03
    container: S1
    systems: [ventilare-parcare]
    ifc2x3: {class: IfcFlowMovingDevice, type: IfcFanType, typeKey: fan-centrifugal}
    exercises: [G4-16]
  - key: CH-01
    class: IfcChiller
    predefinedType: WATERCOOLED
    name: Chiller răcit cu apă
    tag: CH-01
    container: S1
    systems: [apa-racita]
    psets:
      Pset_ChillerTypeCommon:
        ChillerCapacity: {type: IfcPowerMeasure, value: "430000", exercises: [IFC-7, G8-5, "rev B: 450000"]}
        NominalPowerConsumption: {type: IfcPowerMeasure, value: "135000", exercises: [G8-5]}
      Pset_ManufacturerTypeInformation:
        Manufacturer: {type: IfcLabel, value: Exemplu Frig SRL}
        ModelLabel: {type: IfcLabel, value: EXF-WC-40}
    ifc2x3: {class: IfcEnergyConversionDevice, type: IfcChillerType, typeKey: chiller-water}
    exercises: [G8-5, IFC-7, G4-13, G4-14, IFC-13]
  - key: CH-02
    class: IfcChiller
    predefinedType: AIRCOOLED
    name: Chiller răcit cu aer
    tag: CH-02
    container: S1
    systems: [apa-racita]
    psets:
      Pset_ManufacturerTypeInformation:
        Manufacturer: {type: IfcLabel, value: Exemplu Frig SRL}
    ifc2x3: {class: IfcEnergyConversionDevice, type: IfcChillerType, typeKey: chiller-air}
    exercises: [G1-1, "no capacity property: Unknown, never zero"]
  - key: CH-03
    class: IfcBuildingElementProxy
    predefinedType: NOTDEFINED
    name: Chiller rezervă
    objectType: Chiller
    tag: CH-03
    container: S1
    systems: []
    hiddenLayer: true
    psets:
      Date tehnice:
        Putere frigorifică: {type: IfcPowerMeasure, value: "390000", exercises: ["hidden content: gives no value (ifc-input 6.2.13, gate ifc-hidden-content)"]}
    ifc2x3: {class: IfcBuildingElementProxy}
    exercises: ["ifc-input 5.3: element on a presentation layer switched off, carrying a capacity"]
  - key: P1.1
    class: IfcPump
    predefinedType: null
    name: Pompă circulație
    tag: P1.1
    container: S1
    systems: [apa-racita]
    typed: pump-type-circulatie
    psets:
      Date tehnice:
        Configurație: {type: IfcLabel, value: 1+1R, exercises: [G4-4]}
        Putere electrică absorbită: {type: IfcPowerMeasure, value: "5.5", unit: kW, exercises: ["property with its own Unit (kW)"]}
    ifc2x3: {class: IfcFlowMovingDevice, type: IfcPumpType, typeKey: pump-circulator}
    exercises: [G4-4]
  - key: P1.2
    class: IfcPump
    predefinedType: null
    name: Pompă circulație
    tag: P1.2
    container: S1
    systems: [apa-racita]
    typed: pump-type-circulatie
    psets:
      Date tehnice:
        Configurație: {type: IfcLabel, value: 1+1R, exercises: [G4-4]}
        Putere electrică absorbită: {type: IfcReal, value: "5.5", exercises: [IFC-9]}
    ifc2x3: {class: IfcFlowMovingDevice, type: IfcPumpType, typeKey: pump-circulator}
    exercises: [G4-4, IFC-9]
  - key: P2
    class: IfcPump
    predefinedType: null
    name: Pompă circulație
    tag: P2
    container: S1
    systems: [incalzire]
    typed: pump-type-circulatie
    psets:
      Date tehnice:
        Configurație: {type: IfcLabel, value: pompă dublă, exercises: ["twin head: one asset, two motors"]}
        Putere motor: {type: IfcLabel, value: 1.500 kW, exercises: [G8-3]}
    ifc2x3: {class: IfcFlowMovingDevice, type: IfcPumpType, typeKey: pump-circulator}
    exercises: [G8-3, G4-4]
  - key: VE-P1
    class: IfcFan
    predefinedType: TUBEAXIAL
    name: Ventilator parcare
    tag: VE-P1
    container: S1
    systems: [ventilare-parcare, desfumare-parcare]
    lifeSafety: [dual use (Ventilare parcare and Desfumare parcare), "system name: desfumare"]
    ifc2x3: {class: IfcFlowMovingDevice, type: IfcFanType, typeKey: fan-axial}
    exercises: [G11-4]
  - key: VAV-1
    class: IfcAirTerminalBox
    predefinedType: VARIABLEFLOWPRESSUREINDEPENDANT
    name: Unitate VAV
    tags: [VAV-1.01, VAV-1.02, VAV-1.03, VAV-1.04]
    container: E1
    systems: [ventilare-cta-01]
    ifc2x3: {class: IfcFlowController, type: IfcAirTerminalBoxType, typeKey: vav}
