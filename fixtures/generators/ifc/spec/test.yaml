# IFC2X3 type objects: one per typeKey. ElementType carries what IFC2X3 cannot say in its enums.
ifc2x3Types:
  ahu: {class: IfcUnitaryEquipmentType, name: Centrală tratare aer, predefinedType: AIRHANDLER}
  fcu: {class: IfcUnitaryEquipmentType, name: Ventiloconvector, predefinedType: USERDEFINED, elementType: Ventiloconvector}
  chiller-water: {class: IfcChillerType, name: Chiller răcit cu apă, predefinedType: WATERCOOLED}
  chiller-air: {class: IfcChillerType, name: Chiller răcit cu aer, predefinedType: AIRCOOLED}
  pump-circulator: {class: IfcPumpType, name: Pompă circulație, predefinedType: CIRCULATOR, psetsFrom: pumpType}
  pump-notdefined: {class: IfcPumpType, name: Pompă, predefinedType: NOTDEFINED}
  fan-centrifugal: {class: IfcFanType, name: Ventilator CTA-03, predefinedType: CENTRIFUGALBACKWARDINCLINEDCURVED}
  fan-axial: {class: IfcFanType, name: Ventilator parcare, predefinedType: TUBEAXIAL}
  vav: {class: IfcAirTerminalBoxType, name: Unitate VAV, predefinedType: VARIABLEFLOWPRESSUREINDEPENDANT}
  damper-fire: {class: IfcDamperType, name: Clapetă antifoc, predefinedType: FIREDAMPER}
  damper-smoke: {class: IfcDamperType, name: Clapetă de fum, predefinedType: SMOKEDAMPER}
  damper-notdefined: {class: IfcDamperType, name: Clapetă antifoc CA-2.03, predefinedType: NOTDEFINED}
  valve-mixing: {class: IfcValveType, name: Robinet cu trei căi, predefinedType: MIXING}
  valve-cutoff: {class: IfcValveType, name: Electroventil de închidere gaz, predefinedType: SAFETYCUTOFF}
  meter-energy: {class: IfcFlowMeterType, name: Contor energie termică, predefinedType: ENERGYMETER}
  sensor-temperature: {class: IfcSensorType, name: Senzor temperatură cameră, predefinedType: TEMPERATURESENSOR}
  sensor-co2: {class: IfcSensorType, name: Senzor CO2 Restaurant, predefinedType: CO2SENSOR}
  sensor-co: {class: IfcSensorType, name: Senzor CO parcare, predefinedType: USERDEFINED, elementType: COSENSOR}
  sensor-smoke: {class: IfcSensorType, name: Detector de fum, predefinedType: SMOKESENSOR}
  sensor-gas: {class: IfcSensorType, name: Detector de gaz centrală termică, predefinedType: GASSENSOR}
  actuator: {class: IfcActuatorType, name: Servomotor robinet, predefinedType: ELECTRICACTUATOR}
  controller: {class: IfcControllerType, name: Tablou automatizare, predefinedType: USERDEFINED, elementType: PROGRAMMABLE}
  alarm-breakglass: {class: IfcAlarmType, name: Buton manual de alarmare, predefinedType: BREAKGLASSBUTTON}
  sprinkler: {class: IfcFireSuppressionTerminalType, name: Sprinkler pendent, predefinedType: SPRINKLER}
  light-security: {class: IfcLightFixtureType, name: Corp iluminat de siguranță, predefinedType: USERDEFINED, elementType: SECURITYLIGHTING}
  light-point: {class: IfcLightFixtureType, name: Corp iluminat LED, predefinedType: POINTSOURCE}

# ARH elements: slabs (context geometry), escape doors, the fire-fighter lift.
arhElements:
  slabs: [S2, S1, P, E1, E2]
  doors:
    - {key: U-P-01, name: Ușă evacuare, tag: U-P-01, storey: P, fireExit: true, hasDrive: true, position: [0, 6000], lifeSafety: ["Pset_DoorCommon FireExit and HasDrive: door release on an escape route"]}
    - {key: U-P-02, name: Uşă evacuare, tag: U-P-02, storey: P, fireExit: true, hasDrive: true, position: [61000, 6000], lifeSafety: ["Pset_DoorCommon FireExit and HasDrive: door release on an escape route"], note: "ş with a cedilla (U+015F)"}
    - {key: U-P-03, name: Ușă acces restaurant, tag: U-P-03, storey: P, fireExit: false, hasDrive: false, position: [20000, 13000]}
  transport:
    - {key: ASC-01, name: Ascensor pompieri, tag: ASC-01, storey: P, predefinedType: ELEVATOR, position: [45150, 15150], lifeSafety: ["glossary in Name: ascensor pompieri (fire-fighter lift)"]}

# Rev B, a declared revision of rev A (ifc-input 5.3). All other GlobalIds are unchanged.
revB:
  changes:
    - {element: CH-01, pset: Pset_ChillerTypeCommon, property: ChillerCapacity, value: "450000"}
  removed: [CTA-02]
  added:
    - key: VAV-1.05
      class: IfcAirTerminalBox
      predefinedType: VARIABLEFLOWPRESSUREINDEPENDANT
      name: Unitate VAV
      tag: VAV-1.05
      container: E1
      systems: [ventilare-cta-01]
      ifc2x3: {class: IfcFlowController, type: IfcAirTerminalBoxType, typeKey: vav}
      exercises: [IFC-13, "added in rev B"]

# Layers (IfcPresentationLayerAssignment / IfcPresentationLayerWithStyle).
layers:
