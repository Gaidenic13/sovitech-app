  - {key: S1, arh: Subsol 1, mep: SUBSOL 01, elevation: "-3250"}
  - {key: P, arh: Parter, mep: PARTER, elevation: "0"}
  - {key: E1, arh: Etaj 1, mep: ETAJ 01, elevation: "4500"}
  - {key: E2, arh: Etaj 2, mep: ETAJ 02, elevation: "7700"}
  - {key: AT, arh: Cotă atic, mep: COTĂ ATIC, elevation: "11000", exercises: [IFC-4]}

# Space heights (extrusion depth of the space solids), by storey.
spaceHeights: {S1: 2800, P: 3600, E1: 3000, E2: 3000}

