closedBehaviour: >-
  The IFC file is stored and hashed, with the status line "Not analysed: IFC model stored, not
  analysed", because its values are not read. It never counts as analysed coverage in a "Not found
  in the analysed documents" statement (rule 12; new case G12-5). Schema errors and IDS results
  are stored with the document as engineer items, shown on the engineer's view only, and never
  shown as coverage lines (a stricter choice; results as coverage are ifc-input 6.2.14). The
  model's stage stays `unknown` (ifc-input 6.2.2). The model is shown as a document with its
  source (prompt 3 section 8). No candidate comes from IFC.
