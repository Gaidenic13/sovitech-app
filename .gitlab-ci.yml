# GitLab CI for the SOVITECH App. It mirrors `pnpm check` (tools/check.ts) job by
# job: lint, typecheck, unit and guardrail tests, the extractor's tests, the
# render test, then every check in tools/checks/. The proposed-behaviour suite
# runs in its own job, which never blocks. There is no deploy stage (hosting is
# local only; prompt 3 section 5.2).
#
# No GitLab project exists yet: creating one is build-readiness decision 11 (D-33).
# Base images are pinned by digest (Docker Hub, looked up on 2026-09-25).
# company/** never triggers a pipeline and is never scanned (build-readiness decision 12).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &source_paths
        # GitLab matches these with Ruby's File.fnmatch and the flags FNM_PATHNAME,
        # FNM_DOTMATCH and FNM_EXTGLOB: "*" matches every file at the repository
        # root, dotfiles included (.prettierrc, .env.example, skills-lock.json, ...),
        # and stops at the first slash, so it never reaches company/. Every
        # top-level folder except company/ follows; a new top-level folder is added
        # here. (Phase 0 review, finding 20: the list named single root files and
        # left out .claude/skills/, .claude/agents/, skills-lock.json and root
        # dotfiles, which the version-sync and config-exclusion checks read.)
        paths:
          - "*"
          - .claude/**/*
          - apps/**/*
          - design/**/*
          - docs/**/*
          - evals/**/*
          - fixtures/**/*
          - packages/**/*
          - prompts/**/*
          - services/**/*
          - tests/**/*
          - tools/**/*
    - if: $CI_COMMIT_BRANCH
      changes: *source_paths

stages:
  - lint
  - typecheck
  - test
  - render
  - checks

variables:
  PNPM_VERSION: "12.6.0"
  PNPM_STORE_DIR: "$CI_PROJECT_DIR/.pnpm-store"
  PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.cache/ms-playwright"

.node:
  image: node:22.17.1-bookworm@sha256:37ff334612f77d8f999c10af8797727b731629c26f2e83caa6af390998bdc49c
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  before_script:
    - npm install --global "pnpm@${PNPM_VERSION}"
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile

.python:
  image: python:3.12.14-bookworm@sha256:dbbe4ceb97851e2e5fa83798b239811f871cb743b259ba3563737349f6bcfaa0
  before_script:
    # Every distribution is pinned and hashed in the lock (docs/adr/0001-toolchain-and-monorepo.md,
    # docs/adr/0018-extractor-dependencies-and-sandbox-image.md); pip refuses any file whose hash
    # differs and any dependency the lock does not list, and installs wheels only (no build scripts).
    - python3.12 -m venv --clear services/extractor/.venv
    - services/extractor/.venv/bin/python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r services/extractor/requirements-dev.lock

lint:eslint:
  extends: .node
  stage: lint
  script:
    - pnpm run lint:eslint

lint:deps:
  extends: .node
  stage: lint
  script:
    - pnpm run lint:deps

typecheck:
  extends: .node
  stage: typecheck
  script:
    - pnpm run typecheck:packages
    - pnpm run typecheck:root

test:vitest:
  extends: .node
  stage: test
  # Since phase 1 this run includes the database tests (packages/db and the
  # guardrail cases G4-20, G10-3, G10-8 and G13-5), which start Postgres through
  # Testcontainers and so need a Docker service in the job. The service image
  # (docker:dind, pinned by digest) is not among the downloads the owner approved,
  # so it is not added yet (docs/build-log.md, phase 1, "Questions for the owner");
  # until it is, this job fails on those files. `pnpm check` runs them locally.
  variables:
    # The run guard writes its report here; the checks job confirms the case
    # counts against it, as pnpm check does (tools/checks/index/run-counts.ts).
    SOVITECH_RUN_GUARD_OUTPUT: "$CI_PROJECT_DIR/guardrail-run-guard.json"
  script:
    - pnpm exec playwright install --with-deps chromium
    - pnpm run test
  artifacts:
    when: always
    paths:
      - guardrail-run-guard.json
    expire_in: 1 day

test:extractor:
  extends: .python
  stage: test
  script:
    - cd services/extractor
    - .venv/bin/ruff check .
    - .venv/bin/ruff format --check .
    # The fixture generators (fixtures/generators/) under the extractor's ruff settings, with no
    # cache, so no .ruff_cache folder appears at the repository root (phase 2).
    - .venv/bin/ruff check --no-cache --config pyproject.toml ../../fixtures/generators
    - .venv/bin/ruff format --no-cache --check --config pyproject.toml ../../fixtures/generators
    - .venv/bin/pytest -q
  artifacts:
    # The licence check reads the installed wheels' metadata files from here.
    paths:
      - services/extractor/.venv/
    expire_in: 1 day

test:proposed:
  extends: .node
  stage: test
  allow_failure: true
  # Since phase 2 the suite holds the gated IFC cases (ifc-input 5.4 IFC-1 to IFC-14) against
  # the IFC reader and the API, whose API half starts Postgres through Testcontainers: like
  # test:vitest, it needs a Docker service, which waits for the owner (docker:dind).
  script:
    - pnpm run test:proposed

# Regenerates the Python fixtures twice and compares both runs with each other and with the
# committed files (prompt 3 section 8, "Fixtures": CI regenerates and compares; the
# fixture-manifest check also reproduces every listed file from its generator). A CI job cannot
# close its network without a Docker service; locally, `pnpm fixtures:sandbox` runs the same in
# the no-network fixtures image (services/extractor/Dockerfile, target fixtures).
fixtures:regenerate:
  extends: .python
  stage: test
  script:
    - services/extractor/.venv/bin/python -I -B fixtures/generators/build_all.py --out "$CI_PROJECT_DIR/.regen-1"
    - services/extractor/.venv/bin/python -I -B fixtures/generators/build_all.py --out "$CI_PROJECT_DIR/.regen-2"
    - diff -r "$CI_PROJECT_DIR/.regen-1" "$CI_PROJECT_DIR/.regen-2"
    - diff -r "$CI_PROJECT_DIR/.regen-1/fixtures/ifc" fixtures/ifc --exclude=perf
    - diff -r "$CI_PROJECT_DIR/.regen-1/fixtures/ids" fixtures/ids
    - diff -r "$CI_PROJECT_DIR/.regen-1/fixtures/pdf" fixtures/pdf
    - diff -r "$CI_PROJECT_DIR/.regen-1/fixtures/xlsx" fixtures/xlsx

render:
  extends: .node
  stage: render
  script:
    - pnpm exec playwright install --with-deps chromium
    - pnpm run test:render
  artifacts:
    when: on_failure
    paths:
      - test-results/
    expire_in: 7 days

# The checks, their self-tests and the run reconciliation are separate jobs, as
# they are separate steps of pnpm check: the index check fails by design while
# D-33 is open (docs/adr/0003), and that must not stop the self-tests from running.
.checks:
  extends: .node
  stage: checks
  variables:
    # The loosening check reads approvals at the merge base of main and HEAD
    # (packages/registry/src/approvals/git.ts), so it needs the full history and a
    # local main branch; without them it fails closed and names the reason.
    GIT_DEPTH: "0"
  needs:
    - job: test:extractor
      artifacts: true

checks:
  extends: .checks
  script:
    - git show-ref --verify --quiet refs/heads/main || git fetch --no-tags origin +refs/heads/main:refs/heads/main
    # The licence check reads the extractor's wheels with a Python of 3.10 or
    # later. The venv artifact links to the python image's interpreter, which this
    # node image lacks, so the check falls back to python3 on PATH. Install it in
    # the CI container only when the image does not already carry it (not yet run
    # while no GitLab project exists; build-readiness decision 11).
    - command -v python3 >/dev/null 2>&1 || (apt-get update && apt-get install -y --no-install-recommends python3)
    - python3 -c 'import sys; assert sys.version_info >= (3, 10), sys.version'
    - pnpm run checks

checks:selftest:
  extends: .checks
  script:
    - git show-ref --verify --quiet refs/heads/main || git fetch --no-tags origin +refs/heads/main:refs/heads/main
    - command -v python3 >/dev/null 2>&1 || (apt-get update && apt-get install -y --no-install-recommends python3)
    - python3 -c 'import sys; assert sys.version_info >= (3, 10), sys.version'
    # The render self-test runs its harness-page seeds in Chromium, as pnpm check does.
    - pnpm exec playwright install --with-deps chromium
    - pnpm run check:selftest

checks:run-evidence:
  extends: .node
  stage: checks
  needs:
    - job: test:vitest
      artifacts: true
  script:
    # "Real" guardrail cases are the ones the Vitest run passed, not only the ones
    # whose file reads as real (phase 0 review, round 2; tools/checks/index/run-counts.ts).
    - pnpm exec tsx tools/checks/index/reconcile-run.ts guardrail-run-guard.json
