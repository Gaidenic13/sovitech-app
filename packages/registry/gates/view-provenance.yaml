# Gate view-provenance (prompt 3 section 5.4; docs/adr/0005-gates-mechanism.md).
# Every gate starts closed. Code reads it only through readGate() in
# @sovitech/registry/gates. It opens only when a person sets `open: true`
# and every item below carries an approval reference that resolves, while an
# approver is named in docs/guardrails.md section 10; the loosening check
# (tools/checks/loosening) fails anything else. Claude never fills in an
# approvalRef.
id: view-provenance
open: false
waitsFor:
  - item: 'proposal 7.2.8'
    kind: guardrail-proposal
    dId: D-45
    approvalRef: ''
  - item: 'ifc-input 6.2.15'
    kind: guardrail-proposal
    dId: D-46
    approvalRef: ''
closedBehaviour: >-
  On every model and plan view: no pins or highlights from location evidence, no scale bar, no
  north arrow or orientation words, no "From a superseded revision" line, no illustrative model.
  The view names its model with its stage and revision as recorded (2.3).
source: docs/dev-prompts/03-build-interactive-app.md section 5.4, table of gates
