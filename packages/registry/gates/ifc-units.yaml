# Gate ifc-units (prompt 3 section 5.4; docs/adr/0005-gates-mechanism.md).
# Every gate starts closed. Code reads it only through readGate() in
# @sovitech/registry/gates. It opens only when a person sets `open: true`
# and every item below carries an approval reference that resolves, while an
# approver is named in docs/guardrails.md section 10; the loosening check
# (tools/checks/loosening) fails anything else. Claude never fills in an
# approvalRef.
id: ifc-units
open: false
waitsFor:
  - item: 'ifc-input 6.2.11'
    kind: guardrail-proposal
    dId: D-63
    approvalRef: ''
closedBehaviour: >-
  Values declared in m³/s or J, temperatures declared in absolute kelvin, and 0-1 ratios for
  fields registered in % are refused, and recorded in coverage.
source: docs/dev-prompts/03-build-interactive-app.md section 5.4, table of gates
