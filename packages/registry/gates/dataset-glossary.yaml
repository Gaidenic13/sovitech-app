# Gate dataset-glossary (prompt 3 section 5.4; docs/adr/0005-gates-mechanism.md).
# Every gate starts closed. Code reads it only through readGate() in
# @sovitech/registry/gates. It opens only when a person sets `open: true`
# and every item below carries an approval reference that resolves, while an
# approver is named in docs/guardrails.md section 10; the loosening check
# (tools/checks/loosening) fails anything else. Claude never fills in an
# approvalRef.
id: dataset-glossary
open: false
waitsFor:
  - item: 'Romanian glossary, engineer-reviewed'
    kind: dataset
    dId: D-92
    dataset: romanian-glossary
    approvalRef: ''
closedBehaviour: >-
  Abbreviations are not expanded; the glossary tag-prefix tier of rule 3 is not used.
