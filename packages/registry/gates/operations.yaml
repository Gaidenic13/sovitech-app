open: false
waitsFor:
  - item: 'dashboards 8.1'
    kind: owner-decision
    dId: D-28
    approvalRef: ''
  - item: 'proposal 7.2.1'
    kind: guardrail-proposal
    dId: D-76
    approvalRef: ''
  - item: 'proposal 7.2.2'
    kind: guardrail-proposal
    dId: D-80
    approvalRef: ''
  - item: 'proposal 7.2.11'
    kind: guardrail-proposal
    dId: D-75
    approvalRef: ''
  - item: 'proposal 7.2.16'
    kind: guardrail-proposal
    dId: D-79
    approvalRef: ''
  - item: 'proposal 7.2.33'
    kind: guardrail-proposal
    dId: D-85
    approvalRef: ''
closedBehaviour: >-
  The OPERATIONS group is not rendered and no live content is built.
