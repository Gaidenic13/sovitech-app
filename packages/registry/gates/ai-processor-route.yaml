# Gate ai-processor-route (prompt 3 section 5.4; docs/adr/0005-gates-mechanism.md).
# Every gate starts closed. Code reads it only through readGate() in
# @sovitech/registry/gates. It opens only when a person sets `open: true`
# and every item below carries an approval reference that resolves, while an
# approver is named in docs/guardrails.md section 10; the loosening check
# (tools/checks/loosening) fails anything else. Claude never fills in an
# approvalRef.
id: ai-processor-route
open: false
waitsFor:
  - item: 'build-readiness decision 2'
    kind: owner-decision
    dId: D-09
    approvalRef: ''
closedBehaviour: >-
  The AI boundary sends only fixture content: documents whose content hash is in
  `fixtures/manifest.json`, and, for drafting and every other task, values and text from the demo
  project only. Everything else is refused before the call and logged.
source: docs/dev-prompts/03-build-interactive-app.md section 5.4, table of gates
