# Gate dataset-asset-taxonomy (prompt 3 section 5.4; docs/adr/0005-gates-mechanism.md).
# Every gate starts closed. Code reads it only through readGate() in
# @sovitech/registry/gates. It opens only when a person sets `open: true`
# and every item below carries an approval reference that resolves, while an
# approver is named in docs/guardrails.md section 10; the loosening check
# (tools/checks/loosening) fails anything else. Claude never fills in an
# approvalRef.
id: dataset-asset-taxonomy
open: false
waitsFor:
  - item: 'SOVITECH asset taxonomy with lifeSafety flags'
    kind: dataset
    dId: D-92
    dataset: sovitech-asset-taxonomy
    approvalRef: ''
closedBehaviour: >-
  Asset types stay Unknown, and the assets are listed for the engineer under "SOVITECH will
  check"; counts by type read "Not available yet". Evals use a test-only taxonomy.
source: docs/dev-prompts/03-build-interactive-app.md section 5.4, table of gates
