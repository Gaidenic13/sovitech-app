[project]
name = "sovitech-extractor"
version = "0.0.0"
description = "SOVITECH document and IFC extractor (prompt 3 sections 6 and 8)."
requires-python = ">=3.12,<3.13"
# Dependencies are not declared here: they are pinned and hashed in the lock
# files, installed with --require-hashes (docs/adr/0018-extractor-dependencies-
# and-sandbox-image.md). Runtime: requirements.in -> requirements.lock (the
# sandbox image). Fixture generators: requirements-fixtures.in ->
# requirements-fixtures.lock. Local development (pnpm setup:py):
# requirements-dev.in -> requirements-dev.lock, the union plus ruff and pytest.
# IfcOpenShell and IfcTester are withheld (ADR 0018).
dependencies = []

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# company/** is never an input (build-readiness decision 12).
extend-exclude = ["company", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["company", ".venv", "__pycache__"]
addopts = "-ra --strict-markers"
