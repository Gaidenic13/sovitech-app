# Postgres for local development (prompt 3 5.2 "Database"; docs/adr/ on the database).
# The image is pinned by digest and is the one packages/db/src/images.ts names
# (packages/db/src/images.test.ts keeps them equal). Tests do not use this file:
# they start their own throwaway Postgres with Testcontainers.
#
#   cp .env.example .env         # then choose your own passwords in .env (git-ignored)
#   docker compose up -d postgres
#   pnpm --filter @sovitech/db migrate
#
# The superuser configured here is the database administrator: the migration
# runner uses it for roles and guarded functions only. The app connects as
# sovitech_db_app, whose password the runner sets from .env.
#
# Rule 13, "Logs and error reports never contain document text": the server
# log leaves out an error's DETAIL (a failing row or key, which can hold stored
# text) and the failing statement. Migration 0000 sets the same two settings on
# the database itself, so they hold wherever the migrations run.
name: sovitech
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    command: ["postgres", "-c", "log_error_verbosity=terse", "-c", "log_min_error_statement=panic"]
    environment:
      POSTGRES_USER: ${SOVITECH_DB_ADMINISTRATOR_USER:?set SOVITECH_DB_ADMINISTRATOR_USER in .env}
      POSTGRES_PASSWORD: ${SOVITECH_DB_ADMINISTRATOR_PASSWORD:?set SOVITECH_DB_ADMINISTRATOR_PASSWORD in .env}
      POSTGRES_DB: ${SOVITECH_DB_NAME:?set SOVITECH_DB_NAME in .env}
    ports:
      # Local only: bound to the loopback address.
      - "127.0.0.1:${SOVITECH_DB_PORT:?set SOVITECH_DB_PORT in .env}:5432"
    volumes:
      - sovitech-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  sovitech-postgres:
