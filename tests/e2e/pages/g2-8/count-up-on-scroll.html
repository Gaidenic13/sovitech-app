<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Render harness: count-up when scrolled into view</title>
    <!-- Render harness page for G2-8 (docs/adr/0006-render-test.md). The render check must FAIL here. The count-up starts only when the value scrolls into view, as stats bands often do. -->
    <script type="application/json" data-render-display-objects>
      {"building:b-test.guestRooms": {"text": "TEST 123"}}
    </script>
  </head>
  <body data-render-ready>
    <main>
      <h1>Harness page with an animated value</h1>
      <div style="height: 2400px">Scroll down for the figure.</div>
      <p><span id="rooms" data-value-id="building:b-test.guestRooms">TEST 0</span> guest rooms</p>
      <script>
        const element = document.getElementById("rooms");
        const observer = new IntersectionObserver((entries) => {
          if (!entries.some((entry) => entry.isIntersecting)) return;
          observer.disconnect();
          let shown = 0;
          const timer = setInterval(() => {
            shown = Math.min(123, shown + 12);
            element.textContent = `TEST ${shown}`;
            if (shown === 123) clearInterval(timer);
          }, 30);
        });
        observer.observe(element);
      </script>
    </main>
  </body>
</html>
