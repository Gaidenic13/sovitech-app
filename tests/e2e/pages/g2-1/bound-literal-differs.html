<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Render harness: a served value id around a literal</title>
    <!-- Render harness page for G2-1 (docs/adr/0006-render-test.md). The render check must FAIL here. Two value elements carry ids the screen was served, but show numbers their display objects do not serve: a literal in place of the value, and the value with a figure typed next to it. -->
    <script type="application/json" data-render-display-objects>
      {"building:b-test.guestRooms": {"text": "TEST 123"}, "building:b-test.grossFloorArea": {"text": "TEST 12,345 m²"}}
    </script>
  </head>
  <body data-render-ready>
    <main>
      <h1>Harness page with values that are not what was served</h1>
      <p><span data-value-id="building:b-test.guestRooms">TEST 12</span> guest rooms</p>
      <p><span data-value-id="building:b-test.grossFloorArea">TEST 12,345 m² (TEST 1,234 m² usable)</span> gross floor area</p>
    </main>
  </body>
</html>
