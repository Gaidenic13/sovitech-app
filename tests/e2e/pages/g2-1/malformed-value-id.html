<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Render harness: malformed value ids</title>
    <!-- Render harness page for G2-1 (docs/adr/0006-render-test.md). The render check must FAIL here. Elements claim a value id, but the ids are empty or not value ids. -->
    <script type="application/json" data-render-display-objects>
      {"building:b-test.guestRooms": {"text": "TEST 123"}}
    </script>
  </head>
  <body data-render-ready>
    <main>
      <h1>Harness page with one unbound number</h1>
      <p><span data-value-id="building:b-test.guestRooms">TEST 123</span> guest rooms</p>
      <p><span data-value-id="">TEST 12</span> rooms on this level</p>
      <p><span data-value-id="guestRooms">TEST 123</span> guest rooms again</p>
    </main>
  </body>
</html>
