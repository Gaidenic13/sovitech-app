<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Render harness: a quantity inside a time element</title>
    <!-- Render harness page for G2-1 (docs/adr/0006-render-test.md). The render check must FAIL here. A time element whose text is not its own datetime. -->
    <script type="application/json" data-render-display-objects>
      {"building:b-test.guestRooms": {"text": "TEST 123"}}
    </script>
  </head>
  <body data-render-ready>
    <main>
      <h1>Harness page with one unbound number</h1>
      <p><span data-value-id="building:b-test.guestRooms">TEST 123</span> guest rooms</p>
      <p>Area <time datetime="2026-09-25">TEST 12,345</time></p>
    </main>
  </body>
</html>
