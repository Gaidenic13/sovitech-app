<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Render harness: numbered list markers</title>
    <!-- Render harness page for G2-1 (docs/adr/0006-render-test.md). The render check must FAIL here. An ordered list draws decimal markers that no DOM text holds. -->
    <script type="application/json" data-render-display-objects>
      {"building:b-test.guestRooms": {"text": "TEST 123"}}
    </script>
  </head>
  <body data-render-ready>
    <main>
      <h1>Harness page with one unbound number</h1>
      <p><span data-value-id="building:b-test.guestRooms">TEST 123</span> guest rooms</p>
      <ol>
        <li>Upload documents</li>
        <li>Check the building</li>
      </ol>
    </main>
  </body>
</html>
