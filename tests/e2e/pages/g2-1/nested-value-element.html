<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Render harness: a value element inside another</title>
    <!-- Render harness page for G2-1 (docs/adr/0006-render-test.md). The render check must FAIL here. A value element sits inside another value element; each value element holds its own value only. -->
    <script type="application/json" data-render-display-objects>
      {"building:b-test.guestRooms": {"text": "TEST 123"}, "building:b-test.grossFloorArea": {"text": "TEST 12,345 m²"}}
    </script>
  </head>
  <body data-render-ready>
    <main>
      <h1>Harness page with nested value elements</h1>
      <div data-value-id="building:b-test.grossFloorArea">
        <span>TEST 12,345 m²</span>
        <p><span data-value-id="building:b-test.guestRooms">TEST 123</span> guest rooms</p>
      </div>
    </main>
  </body>
</html>
