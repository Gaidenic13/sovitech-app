<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Render harness: a number shown for a moment</title>
    <!-- Render harness page for G2-1 (docs/adr/0006-render-test.md). The render check must FAIL here. A digit outside any value element that appears after load and is gone by the end. -->
    <script type="application/json" data-render-display-objects>
      {"building:b-test.guestRooms": {"text": "TEST 123"}}
    </script>
  </head>
  <body data-render-ready>
    <main>
      <h1>Harness page with one unbound number</h1>
      <p><span data-value-id="building:b-test.guestRooms">TEST 123</span> guest rooms</p>
      <div id="notice"></div>
      <script>
        setTimeout(() => {
          const notice = document.createElement("p");
          notice.textContent = "Saved TEST 12 answers";
          document.getElementById("notice").append(notice);
          setTimeout(() => notice.remove(), 300);
        }, 200);
      </script>
    </main>
  </body>
</html>
