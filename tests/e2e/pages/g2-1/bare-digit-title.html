<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Render harness: bare digit in a title attribute</title>
    <!-- Render harness page for G2-1 (docs/adr/0006-render-test.md). The render check must FAIL here. A digit in a title attribute outside any value element. -->
    <script type="application/json" data-render-display-objects>
      {"building:b-test.guestRooms": {"text": "TEST 123"}}
    </script>
  </head>
  <body data-render-ready>
    <main>
      <h1>Harness page with one unbound number</h1>
      <p><span data-value-id="building:b-test.guestRooms">TEST 123</span> guest rooms</p>
      <p><span title="Updated TEST 12 times">Status</span></p>
    </main>
  </body>
</html>
